name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-phase5:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Download pinned Go dependencies
        run: go mod download
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Fuzz smoke
        run: |
          go test -run '^$' -fuzz FuzzDecodeRootObject -fuzztime=1s ./internal/api
          go test -run '^$' -fuzz FuzzCredentialParser -fuzztime=1s ./internal/totp
          go test -run '^$' -fuzz FuzzCredentialParser -fuzztime=1s ./internal/provider/flysms
          go test -run '^$' -fuzz FuzzCredentialParser -fuzztime=1s ./internal/provider/outlook
          go test -run '^$' -fuzz FuzzMIME -fuzztime=1s ./internal/provider/outlook
          go test -run '^$' -fuzz FuzzExtractor -fuzztime=1s ./internal/extractor
          go test -run '^$' -fuzz FuzzResponseContracts -fuzztime=1s ./internal/provider/flysms
          go test -run '^$' -fuzz FuzzRetryAfter -fuzztime=1s ./internal/provider/flysms
          go test -run '^$' -fuzz FuzzBoundedTokenBucket -fuzztime=1s ./internal/ratelimit
      - name: Phase 5 concurrency acceptance
        run: |
          go test -v -count=1 -run 'TestTwentyConcurrent(TOTPRequestsAreIsolatedAndFast|CredentialsDoNotCross)' ./internal/api ./internal/provider/flysms
          go test -v -count=1 -run 'Test(TwentyActiveFourQueuedAndTwentyFifthBusy|QueuedRequestWaitsForConfiguredTwoSeconds|QueuedRequestsArePromotedFIFOWithoutNewArrivalBypass)' ./internal/admission
      - name: Staticcheck and reachable vulnerability scan
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
      - name: Static Go Phase 5 build
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -tags netgo,osusergo -o /tmp/coderelay ./cmd/coderelay
          /tmp/coderelay --version
          file /tmp/coderelay | grep -q 'statically linked'

  phase0-go-prototype:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]
    defaults:
      run:
        working-directory: prototypes/outlook-go
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: prototypes/outlook-go/go.sum
      - name: Download pinned prototype dependencies
        run: go mod download
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Tests and race detector
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
      - name: Reachable vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
      - name: Static prototype build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/coderelay-outlook-phase0 ./cmd/outlook-phase0

  phase5-artifact:
    needs: go-phase5
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CODERELAY_PROFILE_TIME: 2s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum
      - name: Build static artifact
        run: |
          ./scripts/build.sh
          file dist/coderelay | grep -q 'statically linked'
          go version -m dist/coderelay
      - name: Single-core resource and log-scan smoke
        run: |
          go run ./cmd/phase5-soak \
            -binary dist/coderelay \
            -duration 12s \
            -sample-every 50ms \
            -output dist/phase5-smoke.json
      - name: Synthetic pprof capture
        run: |
          CODERELAY_PROFILE_DIR=dist/pprof ./scripts/profile-phase5.sh
      - name: CycloneDX SBOM
        run: ./scripts/generate-sbom.sh
      - name: Verify flattened artifact checksums
        run: |
          mkdir -p /tmp/coderelay-artifact-layout/pprof
          cp dist/coderelay dist/coderelay.sha256 dist/coderelay.cdx.json dist/coderelay.cdx.json.sha256 /tmp/coderelay-artifact-layout/
          (cd /tmp/coderelay-artifact-layout && sha256sum -c coderelay.sha256 && sha256sum -c coderelay.cdx.json.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: coderelay-go-phase5.2-linux-amd64
          path: |
            dist/coderelay
            dist/coderelay.sha256
            dist/coderelay.cdx.json
            dist/coderelay.cdx.json.sha256
            dist/phase5-smoke.json
            dist/pprof/cpu.prof
            dist/pprof/heap.prof
            dist/pprof/cpu-top.txt
            dist/pprof/heap-top.txt
          if-no-files-found: error
          retention-days: 90
