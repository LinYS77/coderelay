name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  go-phase1:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Download pinned Go dependencies
        run: go mod download
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Tests, race detector, and Phase 1 acceptance
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
          go test -run '^$' -fuzz FuzzDecodeRootObject -fuzztime=1s ./internal/api
          go test -run '^$' -fuzz FuzzCredentialParser -fuzztime=1s ./internal/totp
          go test -v -count=1 -run TestTwentyConcurrentTOTPRequestsAreIsolatedAndFast ./internal/api
      - name: Staticcheck and reachable vulnerability scan
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
      - name: Static Go Phase 1 build
        run: |
          CGO_ENABLED=0 go build -trimpath -tags netgo,osusergo -o /tmp/coderelay-go ./cmd/coderelay
          /tmp/coderelay-go --version

  phase0-go-prototype:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]
    defaults:
      run:
        working-directory: prototypes/outlook-go
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: prototypes/outlook-go/go.sum
      - name: Download pinned prototype dependencies
        run: go mod download
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Tests and race detector
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
      - name: Reachable vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
      - name: Static prototype build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/coderelay-outlook-phase0 ./cmd/outlook-phase0

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Static checks
        run: |
          ruff check coderelay tests binary_entry.py
          python -m compileall -q coderelay binary_entry.py
          python -m pip check
      - name: Tests
        run: pytest -q

  binary:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Build and smoke-test executable
        run: |
          python -m PyInstaller --clean --noconfirm coderelay.spec
          ./dist/coderelay --version
          (cd dist && sha256sum coderelay > coderelay.sha256)
          (cd dist && sha256sum -c coderelay.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: coderelay-linux-x86_64-glibc235
          path: |
            dist/coderelay
            dist/coderelay.sha256
          if-no-files-found: error
          retention-days: 7
