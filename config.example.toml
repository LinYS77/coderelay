# CodeRelay Go Phase 5 configuration.
# This is the only supported server configuration format.

[server]
host = "127.0.0.1"
port = 8787
allowed_hosts = ["2fa.077.li", "localhost", "127.0.0.1"]
cors_origins = []
forwarded_allow_ips = "127.0.0.1,::1"
access_log = false
log_level = "info"
max_wait_seconds = 30
http_connect_timeout_seconds = 5.0
http_read_timeout_seconds = 20.0
http_max_connections = 20
max_inbound_connections = 128
max_concurrent_code_requests = 20
max_queued_code_requests = 4
admission_wait_seconds = 2.0
read_header_timeout_seconds = 3.0
read_timeout_seconds = 10.0
write_timeout_seconds = 100.0
idle_timeout_seconds = 60.0
shutdown_timeout_seconds = 90.0
max_header_bytes = 16384
max_body_bytes = 131072

[providers.outlook]
token_url = "https://login.microsoftonline.com/common/oauth2/v2.0/token"
imap_host = "outlook.office365.com"
imap_port = 993
imap_timeout_seconds = 15.0
poll_interval_seconds = 2.0
max_messages = 10
max_message_bytes = 262144

[providers.outlook.extractor]
senders = []
sender_domains = []
subject_keywords = ["verification", "security code", "验证码", "検証コード", "認証コード", "確認コード"]
patterns = ['(?i)(?:code|验证码|安全码|検証コード|認証コード|確認コード|セキュリティ\s*コード)\D{0,20}(?P<code>\d{6})']
max_age_seconds = 600
allow_generic_fallback = true
generic_requires_keyword = false
max_text_chars = 100000

[providers.flysms]
base_url = "https://flysms.xyz/icloud/api/pickup/messages"
fetch_timeout_seconds = 45.0
poll_interval_seconds = 2.0
history_limit = 30
max_detail_messages = 5

[providers.flysms.extractor]
senders = []
sender_domains = []
subject_keywords = ["verification", "security code", "验证码", "検証コード", "認証コード", "確認コード"]
patterns = ['(?i)(?:code|验证码|安全码|検証コード|認証コード|確認コード|セキュリティ\s*コード)\D{0,20}(?P<code>\d{6})']
max_age_seconds = 600
allow_generic_fallback = true
generic_requires_keyword = false
max_text_chars = 100000

[security]
api_token_hash_files = ["secrets/api-shared.sha256"]
strict_secret_permissions = true
api_rate_limit_per_minute = 240
api_rate_limit_burst = 40
max_ip_rate_limit_entries = 10000
max_principal_rate_limit_entries = 1000
