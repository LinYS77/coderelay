<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · CodeRelay</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="auth-page" data-page="login">
  <main class="auth-shell">
    <section class="panel auth-panel" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">CR</div>
      <p class="eyebrow">PRIVATE CODE RELAY</p>
      <h1 id="login-title">登录 CodeRelay</h1>
      <p class="muted">请输入独立的网页访问密码。密码只发送到当前服务，不会保存在浏览器中。</p>
      <form id="login-form" autocomplete="off">
        <label for="password">访问密码</label>
        <input id="password" name="password" type="password" required minlength="1" maxlength="1024" autocomplete="current-password" autofocus>
        <button type="submit" class="primary">登录</button>
        <p id="login-error" class="error-message" role="alert" hidden></p>
      </form>
      <noscript><p class="error-message">此页面需要启用 JavaScript。</p></noscript>
      <footer>CodeRelay {{ version }}</footer>
    </section>
  </main>
</body>
</html>
