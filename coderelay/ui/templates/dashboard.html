<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CodeRelay</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-page="dashboard">
  <header class="topbar">
    <div>
      <p class="eyebrow">PRIVATE CODE RELAY</p>
      <h1>验证码</h1>
    </div>
    <div class="topbar-actions">
      <span id="clock" class="clock" aria-live="off"></span>
      <button id="logout" type="button" class="quiet">退出</button>
    </div>
  </header>
  <main class="content">
    <section class="intro" aria-labelledby="sources-title">
      <div>
        <h2 id="sources-title">已配置来源</h2>
        <p class="muted">邮箱来源默认只接受最近两分钟内到达的邮件，并最多等待二十秒。</p>
      </div>
      <button id="reload-sources" type="button" class="quiet">刷新状态</button>
    </section>
    <div id="global-error" class="global-error" role="alert" hidden></div>
    <section id="source-grid" class="source-grid" aria-live="polite" aria-busy="true"></section>
    <noscript><p class="error-message">此页面需要启用 JavaScript。</p></noscript>
  </main>
  <footer class="page-footer">CodeRelay {{ version }} · 敏感响应不会被缓存</footer>
</body>
</html>
